name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: template
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U template -d template"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://template:localdev@localhost:5432/template
      TEST_DATABASE_URL: postgresql://template:localdev@localhost:5432/template
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.9.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @template/api prisma migrate deploy --config prisma7.config.ts
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  publish-api:
    if: github.event_name == 'push' && vars.API_IMAGE_REPOSITORY != ''
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.API_IMAGE_USERNAME }}
          password: ${{ secrets.API_IMAGE_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/build/Dockerfile
          platforms: ${{ vars.API_IMAGE_PLATFORM || 'linux/amd64,linux/arm64' }}
          push: true
          tags: docker.io/${{ vars.API_IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
