services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: template
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U template -d template']
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: ${API_IMAGE:?Set API_IMAGE in .env.production}
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://template:${POSTGRES_PASSWORD}@db:5432/template
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy', '--config', 'prisma7.config.ts']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    image: ${API_IMAGE:?Set API_IMAGE in .env.production}
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://template:${POSTGRES_PASSWORD}@db:5432/template
      PORT: '3000'
    ports:
      - '127.0.0.1:${API_PORT:-3100}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
