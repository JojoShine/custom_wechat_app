name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the selected env file}

services:
  migrate:
    image: ${API_IMAGE:?Set API_IMAGE in the selected env file}
    env_file: ${APP_ENV_FILE:?Set APP_ENV_FILE in the selected env file}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the selected env file}
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy', '--config', 'prisma7.config.ts']
    restart: 'no'

  api:
    image: ${API_IMAGE:?Set API_IMAGE in the selected env file}
    env_file: ${APP_ENV_FILE:?Set APP_ENV_FILE in the selected env file}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the selected env file}
      PORT: '3000'
    ports:
      - '127.0.0.1:${API_PORT:-3100}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
