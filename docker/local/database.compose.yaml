services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: template
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U template -d template']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - template_pg_data:/var/lib/postgresql/data

volumes:
  template_pg_data:
