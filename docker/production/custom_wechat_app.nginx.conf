# Include INSIDE the existing HTTPS server {} for your API domain.
# Example: include /etc/nginx/snippets/custom_wechat_app.nginx.conf;
# Do not include directly at http {} level (e.g. a default conf.d/*.conf glob).
# Upstream assumes Nginx runs on the host or shares its network namespace.
# Match 3100 to API_PORT in the deployed .env.production (existing ECS may use 3101).

location = /custom_wechat_app {
    return 308 /custom_wechat_app/$is_args$args;
}

location ^~ /custom_wechat_app/ {
    # Trailing slash strips the public prefix: /custom_wechat_app/health -> /health.
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
    proxy_intercept_errors off;
}
